# Deploy — arch-platform (GOVERNED)
# Deploy av Arch-surfaces er Tom-governed: KUN manuell trigger (workflow_dispatch),
# ALDRI på push. Gates må være grønne FØR deploy. Deployer KUN den saniterte
# Customer Portal (apps/customer-portal) — ALDRI apps/control-center (intern).
name: deploy

on:
  workflow_dispatch: {}

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Git-synk-guard (ingen u-pushet commits i deploy)
        run: |
          LOCAL=$(git rev-parse HEAD)
          REMOTE=$(git ls-remote origin refs/heads/main | awk '{print $1}')
          if [ "$LOCAL" != "$REMOTE" ]; then
            echo "🔴 Deploy avbrutt: lokal ${LOCAL:0:8} ≠ origin/main ${REMOTE:0:8}"
            echo "   Pusher aldri deploy fra en u-synkronisert gren. Push main først, så deploy."
            exit 1
          fi
          echo "✅ Git-synk bekreftet: ${LOCAL:0:8}"
      - name: Syntaks-sjekk (alle .mjs)
        run: |
          for f in $(find packages -name '*.mjs'); do node --check "$f" || exit 1; done
      - name: Build (collect — degraderer grasiøst uten secrets)
        run: npm run build
      - name: Leakage-audit (public-artefakter)
        run: node packages/data-adapters/audit-leak.mjs
      - name: Deploy Ready Gate (12 bevis)
        run: node packages/governance/deploy-ready-check.mjs

  deploy:
    needs: [gates]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build (regenerer data.js i CI)
        run: npm run build
      - name: Deploy Customer Portal (sanitert, KUN kunde-flate)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/customer-portal --project-name arch-platform --branch main

  smoke:
    needs: [deploy]
    runs-on: ubuntu-latest
    steps:
      - name: HTTP smoke (prod + assets)
        run: |
          set -e
          curl -sf -o /dev/null "https://arch-platform.pages.dev/"
          curl -sf -o /dev/null "https://arch-platform.pages.dev/styles.css"
          curl -sf -o /dev/null "https://arch-platform.pages.dev/app.js"
          curl -sf -o /dev/null "https://arch-platform.pages.dev/data.js"
          curl -sf "https://arch-platform.pages.dev/robots.txt" | grep -q "Sitemap: https://arch.axn.no/sitemap.xml"
          curl -sf "https://arch-platform.pages.dev/sitemap.xml" | grep -q "https://arch.axn.no/start"
          echo "✅ smoke OK"
      - name: Privacy smoke (0 lekkasjer i live data.js)
        run: |
          set -e
          DATA=$(curl -sf "https://arch-platform.pages.dev/data.js")
          for pat in '/Users/' 'dev_path' 'LINEAR_API_KEY' 'Bearer' 'secret://'; do
            if echo "$DATA" | grep -q "$pat"; then echo "🔴 LEKKASJE: $pat"; exit 1; fi
          done
          echo "✅ privacy OK (0 sensitive treff)"
      - name: Rollback (ved rød smoke → forrige production-deployment)
        if: failure()
        env:
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          echo "🔴 Smoke feilet — ruller tilbake til forrige production-deployment"
          PREV=$(curl -sf "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/pages/projects/arch-platform/deployments" \
            -H "Authorization: Bearer $CF_TOKEN" \
            | python3 -c "import sys,json; d=json.load(sys.stdin)['result']; prod=[x for x in d if x.get('environment')=='production']; print(prod[1]['id'] if len(prod)>1 else '')")
          if [ -z "$PREV" ]; then echo "Ingen tidligere deployment — manuell håndtering påkrevd"; exit 1; fi
          curl -sf -X POST "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/pages/projects/arch-platform/rollbacks" \
            -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" \
            -d "{\"deployment_id\":\"$PREV\"}" >/dev/null
          echo "✅ Rollback til $PREV utført"
      - name: Alert (ved feil → Linear ARC-team)
        if: failure()
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          ARC_TEAM_ID: d83cc393-375d-4bd1-bb0b-35bdb1bdb8b8
        run: |
          echo "🔴 Deploy/rollback feilet — varsler Linear (ARC)"
          if [ -z "$LINEAR_API_KEY" ]; then echo "LINEAR_API_KEY ikke satt — hopper varsel"; exit 0; fi
          curl -sf -X POST "https://api.linear.app/graphql" \
            -H "Authorization: $LINEAR_API_KEY" -H "Content-Type: application/json" \
            -d "{\"query\":\"mutation IssueCreate(\$t: String!, \$d: String!, \$teamId: String!){ issueCreate(input: { title: \$t, description: \$d, teamId: \$teamId }) { success } }\",\"variables\":{\"t\":\"Deploy-feil — arch-platform (governed deploy)\",\"d\":\"Smoke/rollback feilet i deploy-workflow. Sjekk GitHub Actions.\",\"teamId\":\"$ARC_TEAM_ID\"}}" >/dev/null
          echo "✅ Linear-varsel sendt"
